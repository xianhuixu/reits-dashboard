name: 招投标独立更新
on:
  schedule:
    # 每天北京时间09:20、18:20，含周末；GitHub调度可能延迟。
    - cron: '20 1,10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: tenders-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tenders.txt
      - run: pip install -r requirements-tenders.txt
      - run: python -m playwright install --with-deps chromium
      - name: 回归检查
        run: python -m unittest discover -s tests -p 'test_tenders.py'
      - name: 采集主源和公开备份源
        id: collect
        continue-on-error: true
        run: python fetch_tenders.py
      - name: 发布公告与真实抓取状态
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tenders.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: 更新招投标公告及来源核查状态'
            # 行情任务可能同时提交；只重放本任务的专用数据文件，不覆盖行情。
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
          # GITHUB_TOKEN提交不保证触发Pages，显式请求分支型站点重建。
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: 同步Cloudflare镜像
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          DEPLOY_DIR=$(mktemp -d)
          cp index.html app.js styles.css research-layout.css allocation-tools.js workspace.css workspace.js tender-feed.js ui-utils.js _headers "$DEPLOY_DIR/"
          cp tenders.json data.json data_research.json news.json corp_actions.json projects.json reits_snapshot.json "$DEPLOY_DIR/"
          cp -r lib icons research geography "$DEPLOY_DIR/"
          npx wrangler pages deploy "$DEPLOY_DIR" --project-name=reits-dashboard --branch=main --commit-dirty=true
      - name: 全部来源失败时明确报错
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo '::error::招投标全部来源失败，已尝试发布失败状态并保留历史公告。'
          exit 1
