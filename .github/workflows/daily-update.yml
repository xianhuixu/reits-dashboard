name: 每日数据更新

on:
  schedule:
    # 每个工作日 17:05（Asia/Shanghai = UTC+8，即 UTC 09:05）
    - cron: '5 9 * * 1-5'
  workflow_dispatch:  # 允许手动触发
  push:               # push 时触发，保证两个站点实时同步
    branches: [main]

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pandas

      - name: 更新行情与机构间REITs数据
        run: python fetch_data_em.py

      - name: 更新信息流与分红解禁公告
        run: python fetch_news.py

      - name: 更新项目申报清单
        # 上交所 query.sse.com.cn 对海外 IP 不可达，失败时跳过（由本地每日任务兜底）
        continue-on-error: true
        run: python fetch_projects.py

      - name: 提交并推送数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 分支自适应：在 main/master 哪个分支触发就推回哪个分支，不再硬编码 main
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" = "HEAD" ]; then BRANCH="${GITHUB_REF_NAME}"; git checkout -B "$BRANCH"; fi
          # 暂存所有被跟踪文件的改动（抓取脚本还会写 news.json/universe.json 等多个产出，枚举易漏）
          git add -u
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            LAST=$(python -c "import json,re; s=open('data.js',encoding='utf-8').read(); m=re.search(r'\"lastTradeDate\":\s*\"([^\"]+)\"', s); print(m.group(1) if m else 'unknown')")
            git commit -m "data: 每日数据更新至${LAST}（GitHub Actions）"
          fi
          # 抓取脚本会改动其他未跟踪/未暂存文件，rebase 前先全部 stash，推完再恢复
          STASH_BEFORE=$(git rev-parse -q --verify refs/stash || echo none)
          git stash push -u -m "ci-residual" --quiet || true
          STASH_AFTER=$(git rev-parse -q --verify refs/stash || echo none)
          git fetch origin "$BRANCH"
          if ! git rebase "origin/$BRANCH"; then
            echo "rebase 冲突，放弃 rebase 改用 ours 策略合并"
            git rebase --abort || true
            git merge -X ours "origin/$BRANCH" -m "merge: 合并远端演进（CI自动）" || true
          fi
          git push origin "$BRANCH"
          if [ "$STASH_AFTER" != "$STASH_BEFORE" ]; then git stash pop --quiet || true; fi

      - name: 同步部署到 Cloudflare Pages
        # 无论本日数据是否有变化都同步一次，保证两个站点内容一致
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过 Cloudflare 同步"
            exit 0
          fi
          rm -rf .cf-deploy && mkdir .cf-deploy
          cp index.html app.js styles.css ui-utils.js _headers .cf-deploy/
          cp data.json data_research.json news.json corp_actions.json projects.json reits_snapshot.json .cf-deploy/
          cp -r lib icons .cf-deploy/
          npm i -D wrangler --no-save
          npx wrangler pages deploy .cf-deploy --project-name=reits-dashboard --branch=main --commit-dirty=true
